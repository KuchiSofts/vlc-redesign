name: Bug report
description: Something in VLC Redesign doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! This tracker is for **VLC Redesign** (the unofficial build).
        Problems with the official VLC go to [VideoLAN](https://code.videolan.org/videolan/vlc/-/issues).
  - type: input
    id: version
    attributes:
      label: VLC Redesign version
      description: "⋯ menu → About VLC shows it, e.g. 0.2.0"
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Installer (setup.exe)
        - Portable zip
        - Built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a video
        2. Click …
        3. …
  - type: textarea
    id: media
    attributes:
      label: Media details (if it's about playback)
      description: Format, codec, resolution, or a link to a sample. Please don't upload copyrighted files.
  - type: textarea
    id: screens
    attributes:
      label: Screenshots or a short recording
      description: Drag images or videos here. Compare with the design if it's a visual problem.
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: Turn on Settings › General › Diagnostics › Save a log, restart VLC Redesign, repeat the problem, and drag the log file here. Remove anything private from it first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues, open and closed, and this is not one of them
          required: true
        - label: I use the latest release, or I say above why not
