# SPDX-License-Identifier: GPL-2.0-or-later
#
# Builds the Windows package of every pull request (including the weekly
# upstream VLC merges) and of main, in VideoLAN's official build image, so an
# upstream change that breaks the redesign is caught before it is merged.
# Started by hand with a signing policy, it also signs the package through
# SignPath and makes the release files from it (docs/code-signing.md).
name: Windows build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign through SignPath (release-signing: a release to publish; test-signing: a check, never published)'
        type: choice
        options: [none, test-signing, release-signing]
        default: none

# what the jobs may do with the run's token: read the code (sign and release
# say what more they need)
permissions:
  contents: read

concurrency:
  # a signed run waits for its approvals in SignPath: a push to main must not
  # cancel it (the other runs keep their group)
  group: windows-build-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.sign != 'none' && '-signed' || '' }}
  cancel-in-progress: true

jobs:
  # design/tokens.json against the values the code uses (VLCStyle.qml, the
  # menu and widget styles, the QML components), design/icons and fonts
  # against the app's files, design/build against export.py
  design-tokens:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Check the design tokens
        run: python design/tools/check_qml.py

  win64:
    # pinned: ubuntu-latest moves to a new release under the build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # the prebuilt contrib archive is named after the commit that last
          # touched contrib/ and the packaging
          fetch-depth: 0

      # GitHub's Ubuntu image keeps ~14 GB free; the build (image, contribs,
      # objects, packages) came within bytes of it ("No space left on
      # device" on an ARM64 run): the SDKs it never uses go first
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup                       /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Build image
        run: docker build -t vlc-win64-redesign -f extras/juxtopposed/win64.Dockerfile extras/juxtopposed

      - name: Prebuilt contribs
        run: |
          mkdir -p cache
          for sha in $(git rev-list -n 20 HEAD -- extras/tools contrib extras/ci extras/package/win32); do
            name="vlc-contrib-x86_64-w64-mingw32-$sha.tar.zst"
            if curl -fsSL --retry 3 -o "cache/$name" "https://artifacts.videolan.org/vlc/win64/$name"; then
              echo "CONTRIB=$name" >> "$GITHUB_ENV"; break
            fi
            rm -f "cache/$name"
          done
          test -n "$(ls cache)"

      - name: Build
        run: |
          mkdir -p out
          docker run --rm -u root -v vlc-build:/build vlc-win64-redesign chown videolan:videolan /build
          # the image's user is not the runner's: let it write the package
          # (and the symbol maps)
          mkdir -p symbols
          chmod 777 out symbols
          docker run --rm \
            -e CONTRIB_ARCHIVE="/cache/$CONTRIB" -e STRIP=1 -e SYMBOLS=/symbols \
            -v "$PWD:/src:ro" -v "$PWD/cache:/cache:ro" -v "$PWD/out:/out" -v "$PWD/symbols:/symbols" -v vlc-build:/build \
            vlc-win64-redesign sh -c 'cp /src/extras/juxtopposed/win64-docker.sh /tmp/build.sh && exec sh /tmp/build.sh -r'
          test -s out/vlc.exe
          test -s out/plugins/gui/libqt_plugin.dll

      # (pull requests too: the launch test runs on it)
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vlc-redesign-win64-${{ github.sha }}
          path: out
          retention-days: ${{ github.event_name == 'pull_request' && 2 || 7 }}

      # the function addresses of the binaries before they were stripped (see
      # SYMBOLS in win64-docker.sh): with them, the offsets in a crash dump of
      # the launch test name functions
      - name: Upload the symbol maps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vlc-redesign-win64-symbols-${{ github.sha }}
          path: symbols
          retention-days: ${{ github.event_name == 'pull_request' && 2 || 7 }}

  # The package started and a clip played on Windows (a runner without a GPU
  # or a sound card): the window opens, VLC quits when asked, the clip plays
  # to its end, no QML warning is logged
  launch-test:
    needs: win64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: extras/juxtopposed/ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vlc-redesign-win64-${{ github.sha }}
          path: package

      # a crash of vlc.exe leaves a full dump (Windows Error Reporting), uploaded
      # with the logs: a crash that happens on the runner and not elsewhere can
      # still be read (the call stacks with the modules and their offsets, and
      # the heap: a minidump could not tell a freed object from a missing page;
      # the vlc-redesign-win64-symbols artifact names the functions)
      - name: Keep crash dumps
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\vlc.exe'
          New-Item -Force $key | Out-Null
          New-ItemProperty -Force $key -Name DumpFolder -PropertyType ExpandString -Value "${{ runner.temp }}\vlc-launch-test\dumps" | Out-Null
          New-ItemProperty -Force $key -Name DumpType -PropertyType DWord -Value 2 | Out-Null
          New-ItemProperty -Force $key -Name DumpCount -PropertyType DWord -Value 5 | Out-Null

      - name: Launch and play
        shell: pwsh
        run: ./extras/juxtopposed/ci/launch-test.ps1 -VlcDir package -WorkDir "${{ runner.temp }}"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: launch-test-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vlc-launch-test/*.txt
            ${{ runner.temp }}/vlc-launch-test/*.log
            ${{ runner.temp }}/vlc-launch-test/dumps/*.dmp
          retention-days: 7

  # The Windows on ARM64 package: the same build in VideoLAN's llvm-mingw
  # image (the one of its win64-arm-llvm job), with that job's prebuilt
  # contribs (win64-docker.ps1 -Arch aarch64 does the same on a PC)
  winarm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # GitHub's Ubuntu image keeps ~14 GB free; the build (image, contribs,
      # objects, packages) came within bytes of it ("No space left on
      # device" on an ARM64 run): the SDKs it never uses go first
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup                       /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Build image
        run: docker build -t vlc-winarm64-redesign -f extras/juxtopposed/winarm64.Dockerfile extras/juxtopposed

      - name: Prebuilt contribs
        run: |
          mkdir -p cache
          for sha in $(git rev-list -n 20 HEAD -- extras/tools contrib extras/ci extras/package/win32); do
            name="vlc-contrib-aarch64-w64-mingw32-$sha.tar.zst"
            if curl -fsSL --retry 3 -o "cache/$name" "https://artifacts.videolan.org/vlc/win64-arm-llvm/$name"; then
              echo "CONTRIB=$name" >> "$GITHUB_ENV"; break
            fi
            rm -f "cache/$name"
          done
          test -n "$(ls cache)"

      - name: Build
        run: |
          mkdir -p out
          # (the image has a /build of its own, which fills an empty volume:
          # a file keeps the volume's owner)
          docker run --rm -u root -v vlc-build:/build vlc-winarm64-redesign sh -c 'chown videolan:videolan /build && touch /build/.volume'
          chmod 777 out
          docker run --rm \
            -e ARCH=aarch64 -e CONTRIB_ARCHIVE="/cache/$CONTRIB" -e STRIP=1 \
            -v "$PWD:/src:ro" -v "$PWD/cache:/cache:ro" -v "$PWD/out:/out" -v vlc-build:/build \
            vlc-winarm64-redesign sh -c 'cp /src/extras/juxtopposed/win64-docker.sh /tmp/build.sh && exec sh /tmp/build.sh -r'
          test -s out/vlc.exe
          test -s out/plugins/gui/libqt_plugin.dll

      - name: ARM64 binaries
        shell: pwsh
        run: ./extras/juxtopposed/ci/arm64-smoke.ps1 -VlcDir out -CheckOnly

      # every binary ARM64, every imported DLL in the package or in Windows,
      # Qt and its QML built in, the Live TV add-on, the translations, the
      # credits (the release-mode package: stripped)
      - name: ARM64 package check
        run: |
          python3 -m venv "$RUNNER_TEMP/pe"
          "$RUNNER_TEMP/pe/bin/pip" install --quiet --require-hashes -r extras/juxtopposed/ci/requirements-check.txt
          "$RUNNER_TEMP/pe/bin/python" extras/juxtopposed/ci/pe-check.py out --arch arm64

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vlc-redesign-winarm64-${{ github.sha }}
          path: out
          retention-days: ${{ github.event_name == 'pull_request' && 2 || 7 }}

  # The ARM64 package on ARM64 Windows: its binaries, the plugin cache made
  # (every plugin loaded), then the launch test above. GitHub's Windows on
  # ARM runners are free on public repositories only: never on a private one
  launch-test-arm64:
    needs: winarm64
    if: ${{ !github.event.repository.private }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: extras/juxtopposed/ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vlc-redesign-winarm64-${{ github.sha }}
          path: package

      - name: Keep crash dumps
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\vlc.exe'
          New-Item -Force $key | Out-Null
          New-ItemProperty -Force $key -Name DumpFolder -PropertyType ExpandString -Value "${{ runner.temp }}\vlc-launch-test\dumps" | Out-Null
          New-ItemProperty -Force $key -Name DumpType -PropertyType DWord -Value 1 | Out-Null
          New-ItemProperty -Force $key -Name DumpCount -PropertyType DWord -Value 5 | Out-Null

      - name: Smoke test
        shell: pwsh
        run: ./extras/juxtopposed/ci/arm64-smoke.ps1 -VlcDir package -WorkDir "${{ runner.temp }}"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: launch-test-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vlc-launch-test/*.txt
            ${{ runner.temp }}/vlc-launch-test/*.log
            ${{ runner.temp }}/vlc-launch-test/dumps/*.dmp
          retention-days: 7

  # The ARM64 installer made from that package (make-release.ps1's Inno
  # Setup call, unsigned), installed on ARM64 Windows: every file of the
  # package installed, the smoke test above on the installed copy, the main
  # window and About captured, then uninstalled (arm64-install-test.ps1).
  # Public repositories only (the runner), as above
  install-test-arm64:
    needs: winarm64
    if: ${{ !github.event.repository.private }}
    runs-on: windows-11-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            extras/juxtopposed/ci
            extras/juxtopposed/installer
            modules/gui/qt/util

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vlc-redesign-winarm64-${{ github.sha }}
          path: package

      # (the Inno Setup the releases are made with; x86, emulated here)
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc) -and (Get-Command choco -ErrorAction SilentlyContinue)) {
            choco upgrade innosetup --version 6.7.1 --allow-downgrade -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            # (Inno Setup's own release; the file checked against its hash
            # before it runs: it makes the installer that gets signed)
            $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
            Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe -OutFile $setup
            if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '4D11E8050B6185E0D49BD9E8CC661A7A59F44959A621D31D11033124C4E8A7B0') {
              throw 'innosetup-6.7.1.exe is not the expected file'
            }
            Start-Process $setup -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-'
          }
          if (-not (Test-Path $iscc)) { throw 'No Inno Setup' }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Installer
        shell: pwsh
        run: |
          $m = Select-String -Path modules/gui/qt/util/redesign_version.hpp -Pattern 'VLC_REDESIGN_VERSION\s+"([^"]+)"'
          $version = $m.Matches[0].Groups[1].Value
          & $env:ISCC /Q "/DAppVersion=$version" "/DSourceDir=$((Resolve-Path package).Path)" "/DOutputDir=$PWD\dist" /DArm64 extras/juxtopposed/installer/vlc-redesign.iss
          if ($LASTEXITCODE) { throw "Installer build failed ($LASTEXITCODE)" }
          "SETUP=$PWD\dist\vlc-redesign-$version-winarm64-setup.exe" >> $env:GITHUB_ENV

      - name: Keep crash dumps
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\vlc.exe'
          New-Item -Force $key | Out-Null
          New-ItemProperty -Force $key -Name DumpFolder -PropertyType ExpandString -Value "${{ runner.temp }}\vlc-launch-test\dumps" | Out-Null
          New-ItemProperty -Force $key -Name DumpType -PropertyType DWord -Value 1 | Out-Null
          New-ItemProperty -Force $key -Name DumpCount -PropertyType DWord -Value 5 | Out-Null

      - name: Install, start, play, About, uninstall
        shell: pwsh
        run: ./extras/juxtopposed/ci/arm64-install-test.ps1 -Setup $env:SETUP -Package package -WorkDir "${{ runner.temp }}"

      - name: Upload the logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: install-test-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vlc-launch-test/*.txt
            ${{ runner.temp }}/vlc-launch-test/*.log
            ${{ runner.temp }}/vlc-launch-test/*.png
            ${{ runner.temp }}/vlc-launch-test/dumps/*.dmp
          retention-days: 7

  # The package that passed the launch test, signed through SignPath
  # (docs/code-signing.md): only in a run started by hand with a signing
  # policy, once the SignPath variables exist; the jobs above don't change.
  # Signing changes the bytes of every binary, so what make-release.ps1 does
  # to them comes first: the PE time stamps set to 0.
  sign:
    needs: [win64, launch-test, winarm64, launch-test-arm64]
    if: github.event_name == 'workflow_dispatch' && inputs.sign != 'none' && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-24.04
    # x64 and ARM64 alike (CODE_SIGNING_POLICY.md): one signing request each
    strategy:
      fail-fast: false
      matrix:
        platform: [win64, winarm64]
    # most of it is the wait for the approval in SignPath (3 hours at most)
    timeout-minutes: 210
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            extras/juxtopposed/release
            modules/gui/qt/util

      - name: SignPath setup
        env:
          API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        run: |
          test -n "$API_TOKEN" || { echo "::error::No SIGNPATH_API_TOKEN secret (docs/code-signing.md)"; exit 1; }
          test -n "$PROJECT" || { echo "::error::No SIGNPATH_PROJECT_SLUG variable (docs/code-signing.md)"; exit 1; }

      # the product version every signed binary must have
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^#define VLC_REDESIGN_VERSION "\(.*\)"$/\1/p' modules/gui/qt/util/redesign_version.hpp)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vlc-redesign-${{ matrix.platform }}-${{ github.sha }}
          path: package

      - name: PE time stamps at 0
        run: python3 extras/juxtopposed/release/make-delta.py normalize package

      - name: Upload the package to sign
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vlc-redesign-${{ matrix.platform }}-unsigned-${{ github.sha }}
          path: package
          retention-days: 2

      # artifact configuration "package": extras/juxtopposed/signing/artifact-configuration.xml
      - name: Sign
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ inputs.sign }}
          artifact-configuration-slug: package
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed

      # every file came back; the binaries changed (signed), nothing else did
      - name: Check
        run: |
          cd package
          find . -type f | sort > ../files.txt
          (cd ../signed && find . -type f | sort) | diff ../files.txt -
          while read -r f; do
            case "$f" in
              *.exe|*.dll) ! cmp -s "$f" "../signed/$f" || { echo "::error::$f is not signed"; exit 1; } ;;
              *) cmp -s "$f" "../signed/$f" || { echo "::error::$f was changed"; exit 1; } ;;
            esac
          done < ../files.txt

      - name: Upload the signed package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vlc-redesign-${{ matrix.platform }}-${{ inputs.sign }}-${{ github.sha }}
          path: signed
          retention-days: 14

  # The release files from the signed package: make-release.ps1 -Signed (the
  # plugin cache, the zip, the installer, the small updates from the latest
  # releases), then the installer signed in turn and SHA256SUMS.txt made
  # again for its new bytes. Publishing them stays a step by hand.
  release:
    needs: sign
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win64
            arch: x86_64
          - platform: winarm64
            arch: aarch64
    # the packaging, then the wait for the approval in SignPath (3 hours at most)
    timeout-minutes: 300
    permissions:
      actions: read
      contents: read
    env:
      VERSION: ${{ needs.sign.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            extras/juxtopposed
            modules/gui/qt/util

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vlc-redesign-${{ matrix.platform }}-${{ inputs.sign }}-${{ github.sha }}
          path: package

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Tools
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r extras/juxtopposed/ci/requirements-release.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # the Inno Setup the releases are made with
          choco upgrade innosetup --version 6.7.1 --allow-downgrade -y --no-progress

      # the small updates start from the zips of the latest releases
      - name: Latest releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $tags = @(gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --limit 4 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($tag in $tags) {
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "vlc-redesign-*-$env:PLATFORM.zip" --dir dist
            if ($LASTEXITCODE) { Write-Warning "No portable zip in $tag" }
          }
          $global:LASTEXITCODE = 0
          Get-ChildItem dist | Format-Table Name, Length

      # (full paths: .NET resolves the relative ones elsewhere; the release key
      # is never here: SHA256SUMS.txt is signed on the release PC)
      - name: Package
        shell: pwsh
        run: ./extras/juxtopposed/make-release.ps1 -Signed -Arch ${{ matrix.arch }} -Package "$PWD\package" -Dist "$PWD\dist" -NoSumsSignature

      - name: Upload the installer to sign
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vlc-redesign-${{ matrix.platform }}-setup-unsigned-${{ github.sha }}
          path: dist/vlc-redesign-${{ env.VERSION }}-${{ matrix.platform }}-setup.exe
          retention-days: 2

      # artifact configuration "installer": extras/juxtopposed/signing/installer-configuration.xml
      - name: Sign the installer
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ inputs.sign }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed-setup

      # the files to publish; SHA256SUMS.txt as make-release.ps1 writes it,
      # with the signed installer; its signature (SHA256SUMS.txt.sig, which the
      # app requires) is made on the release PC: release-key.ps1 sign
      - name: Release files
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          SIGN_MODE: ${{ inputs.sign }}
          # the certificate the releases are signed with (its SHA-1 thumbprint,
          # a repository variable): another one is refused
          EXPECTED_SIGNER: ${{ vars.SIGNPATH_CERT_THUMBPRINT }}
        run: |
          $name = "vlc-redesign-$env:VERSION-$env:PLATFORM"
          $signature = Get-AuthenticodeSignature -LiteralPath "signed-setup\$name-setup.exe"
          # a release takes only a valid signature; the test signing's
          # certificate is not trusted by Windows (NotTrusted), nothing else
          $allowed = if ($env:SIGN_MODE -eq 'release-signing') { @('Valid') } else { @('Valid', 'NotTrusted') }
          if ($signature.Status -notin $allowed) { throw "The installer's signature is $($signature.Status)" }
          if ($env:SIGN_MODE -eq 'release-signing') {
            if (-not $env:EXPECTED_SIGNER) { throw 'No SIGNPATH_CERT_THUMBPRINT variable (docs/code-signing.md)' }
            if ($signature.SignerCertificate.Thumbprint -ne $env:EXPECTED_SIGNER) {
              throw "Signed by $($signature.SignerCertificate.Subject), not the expected certificate"
            }
          }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist\$name.zip", "signed-setup\$name-setup.exe" release
          # (the x64 small updates keep the name they had before ARM64)
          $infix = if ($env:PLATFORM -eq 'winarm64') { '-winarm64' } else { '' }
          $deltas = @(Get-ChildItem dist -Filter "vlc-redesign-$env:VERSION$infix-delta-from-*.vrdelta")
          $deltas | Copy-Item -Destination release
          $files = @("$name.zip", "$name-setup.exe") + @($deltas | ForEach-Object { $_.Name })
          $sums = foreach ($f in $files) {
            '{0}  {1}' -f (Get-FileHash "release\$f" -Algorithm SHA256).Hash.ToLower(), $f
          }
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path release) 'SHA256SUMS.txt'), ($sums -join "`n") + "`n")
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vlc-redesign-${{ env.VERSION }}-${{ matrix.platform }}-${{ inputs.sign }}-${{ github.sha }}
          path: release
          retention-days: 14
