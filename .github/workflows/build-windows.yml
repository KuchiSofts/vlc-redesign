#
# Builds the Windows package of every pull request (including the weekly
# upstream VLC merges) and of main, in VideoLAN's official build image, so an
# upstream change that breaks the redesign is caught before it is merged.
name: Windows build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win64:
    # pinned: ubuntu-latest moves to a new release under the build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          # the prebuilt contrib archive is named after the commit that last
          # touched contrib/ and the packaging
          fetch-depth: 0

      - name: Build image
        run: docker build -t vlc-win64-redesign -f extras/juxtopposed/win64.Dockerfile extras/juxtopposed

      - name: Prebuilt contribs
        run: |
          mkdir -p cache
          for sha in $(git rev-list -n 20 HEAD -- extras/tools contrib extras/ci extras/package/win32); do
            name="vlc-contrib-x86_64-w64-mingw32-$sha.tar.zst"
            if curl -fsSL --retry 3 -o "cache/$name" "https://artifacts.videolan.org/vlc/win64/$name"; then
              echo "CONTRIB=$name" >> "$GITHUB_ENV"; break
            fi
            rm -f "cache/$name"
          done
          test -n "$(ls cache)"

      - name: Build
        run: |
          mkdir -p out
          docker run --rm -u root -v vlc-build:/build vlc-win64-redesign chown videolan:videolan /build
          # the image's user is not the runner's: let it write the package
          chmod 777 out
          docker run --rm \
            -e CONTRIB_ARCHIVE="/cache/$CONTRIB" -e STRIP=1 \
            -v "$PWD:/src:ro" -v "$PWD/cache:/cache:ro" -v "$PWD/out:/out" -v vlc-build:/build \
            vlc-win64-redesign sh -c 'cp /src/extras/juxtopposed/win64-docker.sh /tmp/build.sh && exec sh /tmp/build.sh -r'
          test -s out/vlc.exe
          test -s out/plugins/gui/libqt_plugin.dll

      # (pull requests too: the launch test runs on it)
      - name: Upload the package
        uses: actions/upload-artifact@v5
        with:
          name: vlc-redesign-win64-${{ github.sha }}
          path: out
          retention-days: ${{ github.event_name == 'pull_request' && 2 || 7 }}

  # The package started and a clip played on Windows (a runner without a GPU
  # or a sound card): the window opens, VLC quits when asked, the clip plays
  # to its end, no QML warning is logged
  launch-test:
    needs: win64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: extras/juxtopposed/ci

      - uses: actions/download-artifact@v5
        with:
          name: vlc-redesign-win64-${{ github.sha }}
          path: package

      - name: Launch and play
        shell: pwsh
        run: ./extras/juxtopposed/ci/launch-test.ps1 -VlcDir package -WorkDir "${{ runner.temp }}"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: launch-test-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vlc-launch-test/*.txt
            ${{ runner.temp }}/vlc-launch-test/*.log
          retention-days: 7
