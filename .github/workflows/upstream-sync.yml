#
# Every week, try to merge VLC's master into main. A clean merge opens a pull
# request to review; conflicts open (or update) an issue listing the files.
# Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository settings (Actions > General).
name: Upstream sync

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  # (to start the Windows build of the merge: see below)
  actions: write

jobs:
  merge-upstream:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: https://code.videolan.org/videolan/vlc.git
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch VLC master
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream master
          behind=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$behind" >> "$GITHUB_ENV"
          echo "main is $behind commits behind VLC master"

      - name: Try the merge
        if: env.behind != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="upstream-sync/$(date -u +%Y-%m-%d)"
          echo "branch=$branch" >> "$GITHUB_ENV"
          git switch -c "$branch"
          if git merge --no-edit upstream/master; then
            echo "clean=1" >> "$GITHUB_ENV"
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "clean=0" >> "$GITHUB_ENV"
          fi

      - name: Open a pull request
        if: env.behind != '0' && env.clean == '1'
        run: |
          git push --force origin "$branch"
          range="$(git rev-parse --short HEAD^1)..$(git rev-parse --short upstream/master)"
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "Merges ${behind} new commits from [VLC master](https://code.videolan.org/videolan/vlc/-/commits/master) (\`${range}\`)." \
            "The merge applied without conflicts. Build and test the redesign before merging: upstream changes to \`modules/gui/qt\` can still break the interface." \
            "_Opened by the weekly upstream sync._")
          gh pr create --base main --head "$branch" \
            --title "Merge VLC upstream ($(date -u +%Y-%m-%d), ${behind} commits)" \
            --body "$body" || echo "A pull request for $branch already exists"
          # A push and a pull request made with GITHUB_TOKEN start no
          # workflow, so the merge would show no build check: the Windows
          # build is started on the branch instead (GITHUB_TOKEN may start
          # a workflow_dispatch), and shows on its commit
          gh workflow run build-windows.yml --ref "$branch"

      - name: Report conflicts
        if: env.behind != '0' && env.clean == '0'
        run: |
          title="Upstream VLC merge has conflicts"
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "Merging ${behind} new commits from VLC master conflicts in:" \
            "$(sed 's/^/- `/; s/$/`/' conflicts.txt)" \
            "To resolve locally: \`git fetch https://code.videolan.org/videolan/vlc.git master && git merge FETCH_HEAD\`, fix the files above, build and test." \
            "_Updated by the weekly upstream sync on $(date -u +%Y-%m-%d)._")
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
